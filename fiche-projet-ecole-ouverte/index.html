<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fiche projet</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --border: #e6ddd0;
    --muted: #8a7f6f;
    --accent: #b3651a;
    --accent-light: #fdf1e2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #2a231a;
    background: #f8f6f2;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    background: #fff;
    border-bottom: 2px solid var(--accent);
  }
  header img.logo {
    height: 56px;
    max-width: 140px;
    object-fit: contain;
  }
  header .title { flex: 1; }
  header h1 { margin: 0; font-size: 1.25rem; }
  header .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    color: var(--muted);
    font-size: 0.85rem;
  }
  nav.record-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 8px 20px;
    background: #fff;
    border-bottom: 1px solid var(--border);
  }
  nav.record-nav button {
    border: 1px solid var(--border);
    background: #f8f6f2;
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  nav.record-nav button:disabled { opacity: 0.4; cursor: default; }
  nav.record-nav button:not(:disabled):hover { background: var(--accent-light); }
  nav.record-nav .position { color: var(--muted); font-size: 0.85rem; min-width: 48px; text-align: center; }
  #empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
  }
  main { padding: 16px 20px 40px; max-width: 900px; margin: 0 auto; }

  .coordonnateur {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 14px;
    padding: 10px 16px;
    font-size: 0.92rem;
  }
  .coordonnateur .label {
    color: var(--muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }

  section {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  section h2 {
    margin: 0;
    padding: 8px 16px;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #fff;
    background: var(--accent);
  }
  section .body { padding: 4px 16px 8px; }

  .field {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 8px;
    padding: 8px 0;
    border-top: 1px solid #f0ece3;
  }
  .field:first-of-type { border-top: none; }
  .field .label { color: var(--muted); font-size: 0.85rem; }
  .field .value { white-space: pre-wrap; word-break: break-word; }
  .field .value:empty::after { content: "—"; color: #cfc6b8; }

  .triples {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
  }
  .triples .cell {
    padding: 10px 16px;
    border-top: 1px solid #f0ece3;
  }
  .triples .cell:not(:first-child) { border-left: 1px solid #f0ece3; }
  .triples .cell .label {
    color: var(--muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }
  .triples .cell .value { white-space: pre-wrap; word-break: break-word; }
  .triples .cell .value:empty::after { content: "—"; color: #cfc6b8; }
  @media (max-width: 640px) {
    .triples { grid-template-columns: 1fr; }
    .triples .cell:not(:first-child) { border-left: none; }
  }

  .budget-row {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 8px;
    padding: 8px 0;
  }
  .budget-row .label { color: var(--muted); font-size: 0.85rem; }
  .budget-amount {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent);
  }
  .budget-detail {
    border-top: 1px solid #f0ece3;
    padding-top: 8px;
    margin-top: 4px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .budget-detail:empty::after { content: "—"; color: #cfc6b8; }

  .cadre-badge, .session-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .cadre-badge { background: var(--accent-light); color: var(--accent); }
  .session-badge { background: #eef2f6; color: #3b5878; }

  footer.build-info {
    text-align: center;
    padding: 10px;
    color: var(--muted);
    font-size: 0.75rem;
  }
  footer.build-info a {
    color: inherit;
    text-decoration: none;
  }
</style>
</head>
<body>

<header>
  <img class="logo" src="assets/logo-college.jpg" alt="Logo du collège">
  <div class="title">
    <h1 id="projetName">Fiche projet — École ouverte</h1>
    <div class="meta" id="projetMeta"></div>
  </div>
</header>

<nav class="record-nav">
  <button id="prevBtn" onclick="goPrev()">‹ Précédent</button>
  <span class="position" id="posIndicator"></span>
  <button id="nextBtn" onclick="goNext()">Suivant ›</button>
</nav>

<div id="empty">Sélectionnez une ligne dans la table <strong>Projets</strong> pour afficher sa fiche.</div>
<main id="sheet" style="display:none"></main>

<script>
const CADRE_COLORS = {
  "EPI": { bg: "#fdf1e2", fg: "#b3651a" },
  "Projet de classe/s": { bg: "#e9e4f7", fg: "#5b3fa6" },
};

const FIELD_SECTIONS = [
  { title: "Description de l'action", fields: [
    ["Lien_avec_le_projet_d_etablissement", "Lien avec le projet d'établissement"],
    ["Parcours_educatifs_travailles", "Parcours éducatifs travaillés"],
    ["Modalites", "Modalités (organisation, contenus, partenaires)"],
    ["Calendrier_Echeancier", "Calendrier / Échéancier"],
  ]},
  { title: "Besoins matériels", fields: [
    ["Besoins_materiels", "Besoins matériels (salles, équipement, autre…)"],
  ]},
  { title: "Évaluation et valorisation", fields: [
    ["Evaluation_et_valorisation_de_l_action", "Évaluation et valorisation de l'action"],
  ]},
];

let sessionsById = {};
let sessionsLoaded = false;

function badge(value, colorMap, cls) {
  if (!value) return "";
  const { bg, fg } = colorMap[value] || { bg: "#f0ece3", fg: "#5c5344" };
  return `<span class="${cls}" style="background:${bg};color:${fg}">${value}</span>`;
}

function formatDateValue(value) {
  const d = value instanceof Date ? value
    : typeof value === "number" ? new Date(value * 1000)
    : typeof value === "string" ? new Date(value)
    : null;
  if (d && !isNaN(d.getTime())) {
    const pad = n => String(n).padStart(2, "0");
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
  }
  return null;
}

function formatValue(colId, value) {
  if (value === null || value === undefined) return "";
  if (/date/i.test(colId)) {
    const formatted = formatDateValue(value);
    if (formatted) return formatted;
  }
  if (Array.isArray(value)) return value.filter(v => v !== "L").join(", ");
  return String(value);
}

function formatCurrency(value) {
  if (value === null || value === undefined || value === "" || value === 0) return "";
  const num = Number(value);
  if (isNaN(num)) return String(value);
  return num.toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
}

function sessionLabel(refId) {
  if (!refId) return "";
  const s = sessionsById[refId];
  if (!s) return sessionsLoaded ? "" : "…";
  return s.Annee_scolaire || "";
}

function sessionDetail(refId) {
  if (!refId) return "";
  const s = sessionsById[refId];
  if (!s) return sessionsLoaded ? "" : "…";
  const dates = [formatDateValue(s.Date_debut), formatDateValue(s.Date_fin)].filter(Boolean).join(" – ");
  return [s.Session, dates].filter(Boolean).join(" · ");
}

function render(record) {
  const empty = document.getElementById("empty");
  const sheet = document.getElementById("sheet");
  if (!record) {
    empty.style.display = "block";
    sheet.style.display = "none";
    document.getElementById("projetName").textContent = "Fiche projet — École ouverte";
    document.getElementById("projetMeta").innerHTML = "";
    return;
  }
  empty.style.display = "none";
  sheet.style.display = "block";

  document.getElementById("projetName").textContent =
    formatValue("Intitule_de_l_action", record.Intitule_de_l_action) || "Fiche projet — École ouverte";

  const metaParts = [];
  const annee = sessionLabel(record.Annee_Scolaire);
  if (annee) metaParts.push(`<span class="session-badge">${annee}</span>`);
  const session = sessionDetail(record.Session);
  if (session) metaParts.push(`<span class="session-badge">${session}</span>`);
  const cadre = formatValue("Cadre_de_l_action", record.Cadre_de_l_action);
  if (cadre) metaParts.push(badge(cadre, CADRE_COLORS, "cadre-badge"));
  document.getElementById("projetMeta").innerHTML = metaParts.join("");

  const coordonnateur = formatValue("Coordonnateur_s_de_l_action", record.Coordonnateur_s_de_l_action);

  const classes = formatValue("Classe_s_concernee_s_", record.Classe_s_concernee_s_);
  const effectif = formatValue("Effectif_eleves", record.Effectif_eleves);
  const encadrants = formatValue("Encadrant_s_", record.Encadrant_s_);

  const montant = formatCurrency(record.Budget_previsionnel_total_);
  const detail = formatValue("Budget_previsionnel_detail_", record.Budget_previsionnel_detail_);

  sheet.innerHTML = `
    <div class="coordonnateur">
      <div class="label">Coordonnateur(s) de l'action</div>
      <div class="value">${coordonnateur || "—"}</div>
    </div>

    <section>
      <h2>Classes, effectif &amp; encadrement</h2>
      <div class="triples">
        <div class="cell"><div class="label">Classe(s) concernée(s)</div><div class="value">${classes}</div></div>
        <div class="cell"><div class="label">Effectif élèves</div><div class="value">${effectif}</div></div>
        <div class="cell"><div class="label">Encadrant(s)</div><div class="value">${encadrants}</div></div>
      </div>
    </section>

    ${FIELD_SECTIONS.map(section => `
      <section>
        <h2>${section.title}</h2>
        <div class="body">
          ${section.fields.map(([colId, label]) => `
            <div class="field">
              <div class="label">${label}</div>
              <div class="value">${formatValue(colId, record[colId])}</div>
            </div>
          `).join("")}
        </div>
      </section>
    `).join("")}

    <section>
      <h2>Budget prévisionnel</h2>
      <div class="body">
        <div class="budget-row">
          <div class="label">Montant global</div>
          <div class="budget-amount">${montant || "—"}</div>
        </div>
        <div class="budget-detail">${detail}</div>
      </div>
    </section>
  `;
}

let currentRecords = [];
let currentId = null;

function currentIndex() {
  return currentRecords.findIndex(r => r.id === currentId);
}

function updateNav() {
  const idx = currentIndex();
  document.getElementById("prevBtn").disabled = idx <= 0;
  document.getElementById("nextBtn").disabled = idx === -1 || idx >= currentRecords.length - 1;
  document.getElementById("posIndicator").textContent =
    idx === -1 ? "" : `${idx + 1} / ${currentRecords.length}`;
}

function goPrev() {
  const idx = currentIndex();
  if (idx > 0) grist.setCursorPos({ rowId: currentRecords[idx - 1].id });
}

function goNext() {
  const idx = currentIndex();
  if (idx !== -1 && idx < currentRecords.length - 1) grist.setCursorPos({ rowId: currentRecords[idx + 1].id });
}

let lastRecord = null;

async function loadSessions() {
  try {
    const table = await grist.docApi.fetchTable("Sessions");
    sessionsById = {};
    (table.id || []).forEach((id, i) => {
      sessionsById[id] = {
        Annee_scolaire: table.Annee_scolaire ? table.Annee_scolaire[i] : "",
        Session: table.Session ? table.Session[i] : "",
        Date_debut: table.Date_debut ? table.Date_debut[i] : null,
        Date_fin: table.Date_fin ? table.Date_fin[i] : null,
      };
    });
  } catch (e) {
    console.warn("Impossible de charger la table Sessions :", e);
  } finally {
    sessionsLoaded = true;
    render(lastRecord);
    updateNav();
  }
}

grist.ready({ requiredAccess: "full" });
grist.onRecords(records => { currentRecords = records; updateNav(); });
grist.onRecord(record => {
  currentId = record ? record.id : null;
  lastRecord = record;
  render(record);
  updateNav();
});
loadSessions();
</script>

<footer class="build-info"><a href="https://github.com/rthoyer" target="_blank" rel="noopener">@rthoyer</a> — v<span id="version">0</span></footer>

</body>
</html>
