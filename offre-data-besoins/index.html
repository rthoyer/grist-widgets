<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offre data — besoins</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link rel="stylesheet" href="../shared/dsfr/marianne.css">
<script src="../shared/offre-data.js"></script>
<style>
  :root {
    --bleu-france: #000091;
    --rouge-marianne: #e1000f;
    --texte: #161616;
    --texte-doux: #3a3a3a;
    --ligne: #dddddd;
  }
  * { box-sizing: border-box; }
  html, body { background: #fff; }
  body {
    margin: 0;
    font-family: "Marianne", Arial, sans-serif;
    color: var(--texte);
  }

  header.brand {
    display: flex;
    align-items: center;
    gap: 32px;
    padding: 20px 32px 18px;
    border-bottom: 1px solid var(--ligne);
  }
  header.brand .fr-logo { flex-shrink: 0; }
  header.brand h1 {
    margin: 0;
    font-size: 1.75rem;
    font-weight: 700;
    line-height: 1.25;
    cursor: text;
    outline: none;
  }
  header.brand h1[contenteditable="true"] { box-shadow: 0 2px 0 var(--bleu-france); }

  main { padding: 24px 32px 8px; max-width: 1200px; }

  #status { color: var(--texte-doux); padding: 24px 0; }

  section.meta { margin-bottom: 28px; break-inside: avoid-page; }
  section.meta h2 {
    margin: 0 0 12px;
    padding-bottom: 6px;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--bleu-france);
    border-bottom: 2px solid var(--bleu-france);
  }
  section.meta .eyebrow {
    display: block;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--texte-doux);
    margin-bottom: 2px;
  }
  section.meta ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  section.meta li {
    position: relative;
    padding: 4px 0 4px 18px;
    line-height: 1.45;
    break-inside: avoid;
  }
  section.meta li::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 0.8em;
    width: 7px;
    height: 7px;
    background: var(--bleu-france);
  }
  section.meta .cat { margin-bottom: 14px; break-inside: avoid; }
  section.meta .cat:last-child { margin-bottom: 0; }
  section.meta h3 {
    margin: 0 0 4px;
    font-size: 1rem;
    font-weight: 700;
    color: var(--texte);
  }
  section.meta .none { color: var(--texte-doux); font-style: italic; }

  footer.build-info {
    text-align: center;
    padding: 14px;
    color: var(--texte-doux);
    font-size: 0.75rem;
  }
  footer.build-info a { color: inherit; text-decoration: none; }

  @media (max-width: 640px) {
    header.brand { flex-direction: column; align-items: flex-start; gap: 12px; padding: 16px; }
    main { padding: 16px; }
  }

  @media print {
    footer.build-info { display: none; }
    header.brand, main { padding-left: 0; padding-right: 0; }
    section.meta h2 { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<header class="brand">
  <p class="fr-logo">Gouvernement</p>
  <h1 id="docTitle" title="Double-cliquer pour modifier le titre">Offre data</h1>
</header>

<main>
  <div id="status">Chargement…</div>
  <div id="groups"></div>
</main>

<footer class="build-info"><a href="https://github.com/rthoyer" target="_blank" rel="noopener">@rthoyer</a> — v<span id="version">0</span></footer>

<script>
function render(groups) {
  const html = groups.map(g => {
    const eyebrow = g.nom && g.nom !== g.titre ? `<span class="eyebrow">${escapeHtml(g.nom)}</span>` : "";
    const list = renderCategories(g, "Aucun besoin.");
    return `<section class="meta"><h2>${eyebrow}${escapeHtml(g.titre)}</h2>${list}</section>`;
  }).join("");
  document.getElementById("groups").innerHTML = html;
  document.getElementById("status").style.display = groups.length ? "none" : "block";
  if (!groups.length) document.getElementById("status").textContent = "Aucune méta-catégorie.";
}

let reloadTimer = null;
function scheduleReload() {
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(reload, 150);
}

async function reload() {
  try {
    render(await loadOffreData());
  } catch (e) {
    console.error(e);
    const status = document.getElementById("status");
    status.style.display = "block";
    status.textContent = "Impossible de lire les tables Besoin / Categories / Meta_categorie. " +
      "Vérifiez que le widget a l'accès complet au document.";
  }
}

// Titre : celui saisi dans le widget (option « titre ») s'il existe, sinon le nom du document, sinon « Offre data ».
const titleEl = document.getElementById("docTitle");
let customTitle = null;
let docName = null;

function showTitle() {
  const t = customTitle || docName || "Offre data";
  titleEl.textContent = t;
  document.title = t;
}

function editTitle() {
  titleEl.contentEditable = "true";
  titleEl.focus();
  document.getSelection().selectAllChildren(titleEl);
}

async function saveTitle() {
  if (titleEl.contentEditable !== "true") return;
  titleEl.contentEditable = "false";
  const value = titleEl.textContent.trim();
  customTitle = value && value !== docName ? value : null;
  showTitle();
  try {
    await grist.setOption("titre", customTitle);
  } catch (e) {
    console.warn("Impossible d'enregistrer le titre :", e);
  }
}

titleEl.addEventListener("dblclick", editTitle);
titleEl.addEventListener("blur", saveTitle);
titleEl.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); titleEl.blur(); }
  if (e.key === "Escape") { titleEl.contentEditable = "false"; showTitle(); }
});

grist.ready({ requiredAccess: "full", onEditOptions: editTitle });
grist.onOptions(options => {
  customTitle = (options && options.titre) || null;
  showTitle();
});
// Le widget recharge tout le document dès que la table à laquelle il est lié change.
grist.onRecords(scheduleReload);
loadDocName(null).then(name => { docName = name; showTitle(); });
reload();
</script>

</body>
</html>
