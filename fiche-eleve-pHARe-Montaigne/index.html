<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fiche élève</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --border: #dcdfe4;
    --muted: #6b7280;
    --accent: #2f6f4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #1f2328;
    background: #f7f8fa;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: #fff;
    border-bottom: 2px solid var(--accent);
  }
  header img.logo {
    height: 56px;
    max-width: 140px;
    object-fit: contain;
  }
  header .title { flex: 1; text-align: center; }
  header h1 { margin: 0; font-size: 1.2rem; }
  header .meta { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }
  nav.record-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 8px 20px;
    background: #fff;
    border-bottom: 1px solid var(--border);
  }
  nav.record-nav button {
    border: 1px solid var(--border);
    background: #f7f8fa;
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  nav.record-nav button:disabled { opacity: 0.4; cursor: default; }
  nav.record-nav button:not(:disabled):hover { background: #eef0f2; }
  nav.record-nav .position { color: var(--muted); font-size: 0.85rem; min-width: 48px; text-align: center; }
  #empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
  }
  main { padding: 16px 20px 40px; }
  section {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 14px;
    padding: 12px 16px;
  }
  section h2 {
    margin: 0 0 8px;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
  }
  .field {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 8px;
    padding: 4px 0;
    border-top: 1px solid #eef0f2;
  }
  .field:first-of-type { border-top: none; }
  .field .label { color: var(--muted); font-size: 0.85rem; }
  .field .value { white-space: pre-wrap; word-break: break-word; }
  .field .value:empty::after { content: "—"; color: #c7ccd1; }
  .statut-badge {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  footer.build-info {
    text-align: center;
    padding: 10px;
    color: var(--muted);
    font-size: 0.75rem;
  }
  footer.build-info a {
    color: inherit;
    text-decoration: none;
  }
</style>
</head>
<body>

<header>
  <img class="logo" src="assets/logo-college.jpg" alt="Logo du collège">
  <div class="title">
    <h1 id="eleveName">Fiche de suivi élève</h1>
    <div class="meta" id="eleveMeta"></div>
  </div>
  <img class="logo" src="assets/logo-phare.jpg" alt="Logo programme pHARe">
</header>

<nav class="record-nav">
  <button id="prevBtn" onclick="goPrev()">‹ Précédent</button>
  <span class="position" id="posIndicator"></span>
  <button id="nextBtn" onclick="goNext()">Suivant ›</button>
</nav>

<div id="empty">Sélectionnez une ligne dans la table <strong>T2026_2027</strong> pour afficher sa fiche.</div>
<main id="sheet" style="display:none"></main>

<script>
const SECTIONS = [
  { title: "Identité", fields: [
    ["Prenom_Eleve_Cible", "Élève"],
    ["Classe", "Classe"],
    ["Statut", "Statut"],
    ["Methode", "Méthode"],
    ["Signaux_faibles", "Signaux faibles"],
  ]},
  { title: "Repérage", fields: [
    ["reperes_par_", "Repéré(e) par"],
    ["eleve_s_IP", "Élève(s) IP"],
    ["Nature_du_H", "Nature du harcèlement"],
    ["Degre_d_inquietude", "Degré d'inquiétude"],
    ["Qualite_des_echanges", "Qualité des échanges"],
    ["avec_intentionnalite_de_nuire_a_autrui", "Intentionnalité de nuire à autrui"],
    ["INFOS", "Infos"],
  ]},
  { title: "Entretiens", fields: [
    ["Entretien_n_1_mene_par", "Entretien n°1 mené par"],
    ["Entretien_n_1_Date", "Entretien n°1 — date"],
    ["Entretien_n_2_mene_par", "Entretien n°2 mené par"],
    ["Entretien_n_2_date", "Entretien n°2 — date"],
    ["Entretien_n_3_mene_par", "Entretien n°3 mené par"],
    ["Entretien_n_3_date", "Entretien n°3 — date"],
    ["Entretien_n_4_mene_par", "Entretien n°4 mené par"],
    ["Entretien_n_4_date", "Entretien n°4 — date"],
    ["ENTRETIENS_IP", "Entretiens IP"],
  ]},
  { title: "Communication", fields: [
    ["Appel_aux_responsables_legaux", "Appel aux responsables légaux"],
    ["communication_aux_equipes_PP", "Communication aux équipes PP"],
    ["Prenoms_des_eleves_et_classes", "Prénoms des élèves et classes"],
  ]},
  { title: "Suivi et actions", fields: [
    ["SEQUENCES", "Séquence 1"],
    ["SEQUENCES_2", "Séquence 2"],
    ["SEQUENCES_3", "Séquence 3"],
    ["QVAM", "QVAM"],
    ["Theme_des_TR_", "Thème des TR"],
    ["TR", "TR 1"],
    ["TR_2", "TR 2"],
    ["TR_3", "TR 3"],
    ["TR_4", "TR 4"],
    ["Propositions_", "Propositions"],
    ["Resultats", "Résultats"],
    ["Aide_Allie_e_s", "Aide allié(e)s"],
    ["c180_", "c180"],
  ]},
];

const STATUT_COLORS = {
  "Harcèlement": { bg: "#e0807a", fg: "#fff" },
  "En cours de traitement": { bg: "#f5d33f", fg: "#1f2328" },
  "Résolu": { bg: "#3f8f57", fg: "#fff" },
  "Autres S&R": { bg: "#4a90d9", fg: "#fff" },
  "Intimidateurs présumés ou harceleurs en posture perverse": { bg: "#9b9b9b", fg: "#fff" },
  "A traiter rapidement": { bg: "#f2a54a", fg: "#1f2328" },
};

const METHODE_COLORS = {
  "MPP": { bg: "#a78bfa", fg: "#fff" },
  "Palo Alto": { bg: "#6fa3e0", fg: "#fff" },
};

const DEGRE_COLORS = {
  "Faible": { bg: "#f5d33f", fg: "#1f2328" },
  "Moyen": { bg: "#f2a54a", fg: "#1f2328" },
  "Élevé": { bg: "#e0807a", fg: "#fff" },
  "Très Élevé": { bg: "#c0392b", fg: "#fff" },
};

const QUALITE_COLORS = {
  "Difficiles": { bg: "#c0392b", fg: "#fff" },
  "Bons": { bg: "#f5d33f", fg: "#1f2328" },
  "Très Bons": { bg: "#5cb85c", fg: "#fff" },
};

function badge(value, colorMap) {
  if (!value) return "";
  const { bg, fg } = colorMap[value] || { bg: "#c7ccd1", fg: "#1f2328" };
  return `<span class="statut-badge" style="background:${bg};color:${fg}">${value}</span>`;
}

function formatValue(colId, value) {
  if (value === null || value === undefined) return "";
  if (/date/i.test(colId)) console.debug("DATE DEBUG", colId, typeof value, value);
  if (/date/i.test(colId) && (typeof value === "number" || typeof value === "string")) {
    const d = typeof value === "number" ? new Date(value * 1000) : new Date(value);
    if (!isNaN(d.getTime())) {
      const pad = n => String(n).padStart(2, "0");
      return `${pad(d.getUTCDate())}/${pad(d.getUTCMonth() + 1)}/${d.getUTCFullYear()}`;
    }
  }
  if (Array.isArray(value)) return value.filter(v => v !== "L").join(", ");
  return String(value);
}

function render(record) {
  const empty = document.getElementById("empty");
  const sheet = document.getElementById("sheet");
  if (!record) {
    empty.style.display = "block";
    sheet.style.display = "none";
    document.getElementById("eleveName").textContent = "Fiche de suivi élève";
    document.getElementById("eleveMeta").textContent = "";
    return;
  }
  empty.style.display = "none";
  sheet.style.display = "block";
  document.getElementById("eleveName").textContent = formatValue("Prenom_Eleve_Cible", record.Prenom_Eleve_Cible) || "Fiche de suivi élève";
  document.getElementById("eleveMeta").textContent = formatValue("Classe", record.Classe);

  sheet.innerHTML = SECTIONS.map(section => `
    <section>
      <h2>${section.title}</h2>
      ${section.fields.map(([colId, label]) => {
        const value = formatValue(colId, record[colId]);
        const display =
          colId === "Statut" ? badge(value, STATUT_COLORS) :
          colId === "Methode" ? badge(value, METHODE_COLORS) :
          colId === "Degre_d_inquietude" ? badge(value, DEGRE_COLORS) :
          colId === "Qualite_des_echanges" ? badge(value, QUALITE_COLORS) :
          value;
        return `
        <div class="field">
          <div class="label">${label}</div>
          <div class="value">${display}</div>
        </div>
      `;
      }).join("")}
    </section>
  `).join("");
}

let currentRecords = [];
let currentId = null;

function currentIndex() {
  return currentRecords.findIndex(r => r.id === currentId);
}

function updateNav() {
  const idx = currentIndex();
  document.getElementById("prevBtn").disabled = idx <= 0;
  document.getElementById("nextBtn").disabled = idx === -1 || idx >= currentRecords.length - 1;
  document.getElementById("posIndicator").textContent =
    idx === -1 ? "" : `${idx + 1} / ${currentRecords.length}`;
}

function goPrev() {
  const idx = currentIndex();
  if (idx > 0) grist.setCursorPos({ rowId: currentRecords[idx - 1].id });
}

function goNext() {
  const idx = currentIndex();
  if (idx !== -1 && idx < currentRecords.length - 1) grist.setCursorPos({ rowId: currentRecords[idx + 1].id });
}

grist.ready({ requiredAccess: "read table" });
grist.onRecords(records => { currentRecords = records; updateNav(); });
grist.onRecord(record => {
  currentId = record ? record.id : null;
  render(record);
  updateNav();
});
</script>

<footer class="build-info"><a href="https://github.com/rthoyer" target="_blank" rel="noopener">@rthoyer</a> — v<span id="version">15</span></footer>

</body>
</html>
